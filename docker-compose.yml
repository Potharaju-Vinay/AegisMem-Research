# AegisMem Multi-Container Segmented Deployment Architecture (Part C1 / F3)
# Enforces isolated networks: public-net, data-net, vault-net, anchor-net

services:
  memory-db:
    image: postgres:16-alpine
    container_name: aegismem-memory-db
    environment:
      POSTGRES_DB: aegismem_live
      POSTGRES_USER: aegis_admin
      POSTGRES_PASSWORD: ${AEGISMEM_DB_PASSWORD:-aegis_secure_password_2026}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - memory_pgdata:/var/lib/postgresql/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_admin -d aegismem_live"]
      interval: 5s
      timeout: 5s
      retries: 5

  vault-db:
    image: postgres:16-alpine
    container_name: aegismem-vault-db
    environment:
      POSTGRES_DB: aegismem_vault
      POSTGRES_USER: vault_operator
      POSTGRES_PASSWORD: ${AEGISMEM_VAULT_PASSWORD:-vault_airgapped_password_2026}
    volumes:
      - vault_pgdata:/var/lib/postgresql/data
    networks:
      - vault-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault_operator -d aegismem_vault"]
      interval: 5s
      timeout: 5s
      retries: 5

  aegismem-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegismem-gateway
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://aegis_admin:${AEGISMEM_DB_PASSWORD:-aegis_secure_password_2026}@memory-db:5432/${AEGISMEM_DB_NAME:-aegismem_live}
      - AEGISMEM_STORAGE_BACKEND=postgresql
      - AEGIS_STORAGE_BACKEND=postgresql
      - AEGIS_OWNER_AUTH=true
      - ANCHOR_URL=http://anchor:8000
      - RECOVERY_SERVICE_URL=http://aegismem-recovery:8000
      - SUPPORT_AGENT_URL=http://support-agent:8000
    volumes:
      - ./core:/app/core
      - ./security:/app/security
      - ./data:/app/data
      - ./api:/app/api
      - ./agent:/app/agent
      - ./domain:/app/domain
      - ./services:/app/services
      - ./admin_client.py:/app/admin_client.py
      - ./.env:/app/.env
    ports:
      - "8000:8000"
    networks:
      - public-net
      - data-net
      - anchor-net
    depends_on:
      memory-db:
        condition: service_healthy

  aegismem-detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegismem-detector
    command: ["python", "-m", "core.security.watcher"]
    healthcheck:
      test: ["CMD", "python", "-c", "import time, sys; sys.exit(0 if time.time() - float(open('/tmp/watcher_heartbeat').read().strip()) < 15 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - DATABASE_URL=postgresql+psycopg2://aegis_admin:${AEGISMEM_DB_PASSWORD:-aegis_secure_password_2026}@memory-db:5432/${AEGISMEM_DB_NAME:-aegismem_live}
      - AEGISMEM_STORAGE_BACKEND=postgresql
      - AEGIS_STORAGE_BACKEND=postgresql
      - RECOVERY_SERVICE_URL=http://aegismem-recovery:8000
    volumes:
      - ./core:/app/core
      - ./security:/app/security
      - ./data:/app/data
      - ./api:/app/api
      - ./agent:/app/agent
      - ./domain:/app/domain
      - ./services:/app/services
      - ./admin_client.py:/app/admin_client.py
      - ./.env:/app/.env
    networks:
      - data-net
    depends_on:
      memory-db:
        condition: service_healthy

  aegismem-recovery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegismem-recovery
    command: ["uvicorn", "services.recovery_service:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - DATABASE_URL=postgresql+psycopg2://aegis_admin:${AEGISMEM_DB_PASSWORD:-aegis_secure_password_2026}@memory-db:5432/${AEGISMEM_DB_NAME:-aegismem_live}
      - VAULT_URL=postgresql+psycopg2://vault_operator:${AEGISMEM_VAULT_PASSWORD:-vault_airgapped_password_2026}@vault-db:5432/aegismem_vault
      - ANCHOR_URL=http://anchor:8000
    volumes:
      - ./core:/app/core
      - ./security:/app/security
      - ./data:/app/data
      - ./api:/app/api
      - ./agent:/app/agent
      - ./domain:/app/domain
      - ./attack_lab:/app/attack_lab
      - ./services:/app/services
      - ./admin_client.py:/app/admin_client.py
      - ./.env:/app/.env
    networks:
      - data-net
      - vault-net
      - anchor-net
    depends_on:
      memory-db:
        condition: service_healthy
      vault-db:
        condition: service_healthy

  anchor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegismem-anchor-witness
    command: ["uvicorn", "services.anchor_service:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./core:/app/core
      - ./security:/app/security
      - ./services:/app/services
    networks:
      - anchor-net

  support-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegismem-support-agent
    command: ["uvicorn", "services.agent_service:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      - GATEWAY_URL=http://aegismem-gateway:8000
      - DATABASE_URL=postgresql+psycopg2://aegis_admin:${AEGISMEM_DB_PASSWORD:-aegis_secure_password_2026}@memory-db:5432/${AEGISMEM_DB_NAME:-aegismem_live}
    volumes:
      - ./core:/app/core
      - ./security:/app/security
      - ./data:/app/data
      - ./api:/app/api
      - ./agent:/app/agent
      - ./domain:/app/domain
      - ./services:/app/services
      - ./.env:/app/.env
    networks:
      - public-net
      - data-net
    depends_on:
      - aegismem-gateway
      - memory-db

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegismem-dashboard
    command: ["python", "scripts/dashboard_server.py", "--port", "5173", "--gateway", "http://aegismem-gateway:8000"]
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/dist:/app/frontend/dist:ro
      - ./scripts:/app/scripts:ro
    networks:
      - public-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - aegismem-gateway

  attacker:
    image: debian:bookworm-slim
    container_name: aegismem-attacker
    command: ["bash", "-c", "apt-get update && apt-get install -y curl jq python3 && echo 'Adversary Container Ready' && sleep infinity"]
    networks:
      - public-net
    depends_on:
      - aegismem-gateway

networks:
  public-net:
    driver: bridge
  data-net:
    driver: bridge
    internal: false
  vault-net:
    driver: bridge
    internal: false
  anchor-net:
    driver: bridge
    internal: false

volumes:
  memory_pgdata:
  vault_pgdata:
