# AegisMem Multi-Container Segmented Deployment Architecture (Part C1)
# Enforces isolated networks: public-net, data-net, vault-net, anchor-net

services:
  memory-db:
    image: postgres:16-alpine
    container_name: aegismem-memory-db
    environment:
      POSTGRES_DB: aegismem_live
      POSTGRES_USER: aegis_admin
      POSTGRES_PASSWORD: ${AEGISMEM_DB_PASSWORD:-aegis_secure_password_2026}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - memory_pgdata:/var/lib/postgresql/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_admin -d aegismem_live"]
      interval: 5s
      timeout: 5s
      retries: 5

  vault-db:
    image: postgres:16-alpine
    container_name: aegismem-vault-db
    environment:
      POSTGRES_DB: aegismem_vault
      POSTGRES_USER: vault_operator
      POSTGRES_PASSWORD: ${AEGISMEM_VAULT_PASSWORD:-vault_airgapped_password_2026}
    volumes:
      - vault_pgdata:/var/lib/postgresql/data
    networks:
      - vault-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault_operator -d aegismem_vault"]
      interval: 5s
      timeout: 5s
      retries: 5

  aegismem-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegismem-gateway
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://aegis_admin:${AEGISMEM_DB_PASSWORD:-aegis_secure_password_2026}@memory-db:5432/${AEGISMEM_DB_NAME:-aegismem_live}
      - AEGISMEM_STORAGE_BACKEND=postgresql
      - AEGIS_STORAGE_BACKEND=postgresql
      - AEGIS_OWNER_AUTH=true
    volumes:
      - ./core:/app/core
      - ./security:/app/security
      - ./data:/app/data
      - ./api:/app/api
      - ./agent:/app/agent
      - ./domain:/app/domain
      - ./admin_client.py:/app/admin_client.py
      - ./.env:/app/.env
    ports:
      - "8000:8000"
    networks:
      - public-net
      - data-net
    depends_on:
      memory-db:
        condition: service_healthy

  aegismem-detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegismem-detector
    command: ["python", "-m", "core.security.watcher"]
    healthcheck:
      disable: true
    environment:
      - DATABASE_URL=postgresql+psycopg2://aegis_admin:${AEGISMEM_DB_PASSWORD:-aegis_secure_password_2026}@memory-db:5432/${AEGISMEM_DB_NAME:-aegismem_live}
      - AEGISMEM_STORAGE_BACKEND=postgresql
      - AEGIS_STORAGE_BACKEND=postgresql
    volumes:
      - ./core:/app/core
      - ./security:/app/security
      - ./data:/app/data
      - ./api:/app/api
      - ./agent:/app/agent
      - ./domain:/app/domain
      - ./admin_client.py:/app/admin_client.py
      - ./.env:/app/.env
    networks:
      - data-net
    depends_on:
      memory-db:
        condition: service_healthy

  aegismem-recovery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegismem-recovery
    command: ["python", "-c", "import time; print('AegisMem Self-Healing TCRP Resolver Active'); time.sleep(86400)"]
    healthcheck:
      disable: true
    environment:
      - DATABASE_URL=postgresql+psycopg2://aegis_admin:${AEGISMEM_DB_PASSWORD:-aegis_secure_password_2026}@memory-db:5432/${AEGISMEM_DB_NAME:-aegismem_live}
      - VAULT_URL=postgresql+psycopg2://vault_operator:${AEGISMEM_VAULT_PASSWORD:-vault_airgapped_password_2026}@vault-db:5432/aegismem_vault
    volumes:
      - ./core:/app/core
      - ./security:/app/security
      - ./data:/app/data
      - ./api:/app/api
      - ./agent:/app/agent
      - ./domain:/app/domain
      - ./admin_client.py:/app/admin_client.py
      - ./.env:/app/.env
    networks:
      - data-net
      - vault-net
    depends_on:
      memory-db:
        condition: service_healthy
      vault-db:
        condition: service_healthy

  anchor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegismem-anchor-witness
    command: ["python", "-c", "import time; print('AegisMem Independent Anchor Witness Active'); time.sleep(86400)"]
    healthcheck:
      disable: true
    networks:
      - anchor-net

  support-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegismem-support-agent
    command: ["python", "-c", "import time; print('Enterprise Support Agent Active (RAG via ReadPathGate)'); time.sleep(86400)"]
    healthcheck:
      disable: true
    environment:
      - GATEWAY_URL=http://aegismem-gateway:8000
    networks:
      - public-net
    depends_on:
      - aegismem-gateway

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegismem-dashboard
    command: ["python", "scripts/dashboard_server.py", "--port", "5173", "--gateway", "http://aegismem-gateway:8000"]
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/dist:/app/frontend/dist:ro
      - ./scripts:/app/scripts:ro
    networks:
      - public-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - aegismem-gateway

  attacker:
    image: debian:bookworm-slim
    container_name: aegismem-attacker
    command: ["bash", "-c", "apt-get update && apt-get install -y curl jq python3 && echo 'Adversary Container Ready' && sleep infinity"]
    networks:
      - public-net
    depends_on:
      - aegismem-gateway

networks:
  public-net:
    driver: bridge
  data-net:
    driver: bridge
    internal: false
  vault-net:
    driver: bridge
    internal: false
  anchor-net:
    driver: bridge
    internal: false

volumes:
  memory_pgdata:
  vault_pgdata:

