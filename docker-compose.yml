# AegisMem Multi-Container Segmented Deployment Architecture (Hardened Milestone F4)
# Enforces strictly isolated internal networks: data-net, vault-net, anchor-net
# Enforces secret segregation: private keys only in owning containers, read-only.
# Zero plain-text fallback passwords: required from .env.

services:
  memory-db:
    image: postgres:16-alpine
    container_name: aegismem-memory-db
    environment:
      POSTGRES_DB: ${AEGISMEM_DB_NAME:-aegismem_live}
      POSTGRES_USER: ${AEGISMEM_DB_USER:-aegis_admin}
      POSTGRES_PASSWORD: ${AEGISMEM_DB_PASSWORD:?AEGISMEM_DB_PASSWORD environment variable is required}
    volumes:
      - memory_pgdata:/var/lib/postgresql/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AEGISMEM_DB_USER:-aegis_admin} -d ${AEGISMEM_DB_NAME:-aegismem_live}"]
      interval: 5s
      timeout: 5s
      retries: 5

  vault-db:
    image: postgres:16-alpine
    container_name: aegismem-vault-db
    environment:
      POSTGRES_DB: ${AEGISMEM_VAULT_NAME:-aegismem_vault}
      POSTGRES_USER: ${AEGISMEM_VAULT_USER:-vault_operator}
      POSTGRES_PASSWORD: ${AEGISMEM_VAULT_PASSWORD:?AEGISMEM_VAULT_PASSWORD environment variable is required}
    volumes:
      - vault_pgdata:/var/lib/postgresql/data
    networks:
      - vault-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AEGISMEM_VAULT_USER:-vault_operator} -d ${AEGISMEM_VAULT_NAME:-aegismem_vault}"]
      interval: 5s
      timeout: 5s
      retries: 5

  aegismem-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegismem-gateway
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://${AEGISMEM_DB_USER:-aegis_admin}:${AEGISMEM_DB_PASSWORD:?AEGISMEM_DB_PASSWORD is required}@memory-db:5432/${AEGISMEM_DB_NAME:-aegismem_live}
      - AEGISMEM_STORAGE_BACKEND=postgresql
      - AEGIS_STORAGE_BACKEND=postgresql
      - AEGIS_OWNER_AUTH=true
      - ANCHOR_URL=http://anchor:8000
      - RECOVERY_SERVICE_URL=http://aegismem-recovery:8000
      - SUPPORT_AGENT_URL=http://support-agent:8000
      - AEGISMEM_INTERNAL_TOKEN=${AEGISMEM_INTERNAL_TOKEN}
      - AEGISMEM_OWNER_TOKEN=${AEGISMEM_OWNER_TOKEN}
      - AEGISMEM_ENABLE_ATTACK_LAB=${AEGISMEM_ENABLE_ATTACK_LAB:-1}
    volumes:
      # Only public keys, read-only. ZERO private keys mounted.
      - ./security/public_keys:/app/security/keys:ro
      - ./security/integrity_manifests:/app/security/integrity_manifests:ro
      - ./security/provenance_checkpoints:/app/security/provenance_checkpoints:ro
      - ./security/trusted_checkpoint_heads:/app/security/trusted_checkpoint_heads:ro
      - ./security/trust_vault:/app/security/trust_vault:ro
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - public-net
      - data-net
      - anchor-net
    depends_on:
      memory-db:
        condition: service_healthy

  aegismem-detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegismem-detector
    command: ["python", "-m", "core.security.watcher"]
    healthcheck:
      test: ["CMD", "python", "-c", "import time, sys; sys.exit(0 if time.time() - float(open('/tmp/watcher_heartbeat').read().strip()) < 15 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - DATABASE_URL=postgresql+psycopg2://${AEGISMEM_DB_USER:-aegis_admin}:${AEGISMEM_DB_PASSWORD:?AEGISMEM_DB_PASSWORD is required}@memory-db:5432/${AEGISMEM_DB_NAME:-aegismem_live}
      - AEGISMEM_STORAGE_BACKEND=postgresql
      - AEGIS_STORAGE_BACKEND=postgresql
      - RECOVERY_SERVICE_URL=http://aegismem-recovery:8000
      - AEGISMEM_INTERNAL_TOKEN=${AEGISMEM_INTERNAL_TOKEN}
    volumes:
      # Detector gets only public keys and manifests read-only. ZERO private keys, ZERO vault write.
      - ./security/public_keys:/app/security/keys:ro
      - ./security/integrity_manifests:/app/security/integrity_manifests:ro
      - ./security/provenance_checkpoints:/app/security/provenance_checkpoints:ro
      - ./security/trusted_checkpoint_heads:/app/security/trusted_checkpoint_heads:ro
      - ./security/trust_vault:/app/security/trust_vault:ro
    networks:
      - data-net
    depends_on:
      memory-db:
        condition: service_healthy

  aegismem-recovery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegismem-recovery
    command: ["uvicorn", "services.recovery_service:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - DATABASE_URL=postgresql+psycopg2://${AEGISMEM_DB_USER:-aegis_admin}:${AEGISMEM_DB_PASSWORD:?AEGISMEM_DB_PASSWORD is required}@memory-db:5432/${AEGISMEM_DB_NAME:-aegismem_live}
      - VAULT_URL=postgresql+psycopg2://${AEGISMEM_VAULT_USER:-vault_operator}:${AEGISMEM_VAULT_PASSWORD:?AEGISMEM_VAULT_PASSWORD is required}@vault-db:5432/${AEGISMEM_VAULT_NAME:-aegismem_vault}
      - ANCHOR_URL=http://anchor:8000
      - AEGISMEM_INTERNAL_TOKEN=${AEGISMEM_INTERNAL_TOKEN}
    volumes:
      # Recovery container gets recovery private key + public keys, and vault storage
      - ./security/recovery_keys:/app/security/keys:ro
      - ./security/trust_vault:/app/security/trust_vault
      - ./security/integrity_manifests:/app/security/integrity_manifests
      - ./security/provenance_checkpoints:/app/security/provenance_checkpoints
      - ./security/trusted_checkpoint_heads:/app/security/trusted_checkpoint_heads
      - ./security/recovery_attestations:/app/security/recovery_attestations
    networks:
      - data-net
      - vault-net
      - anchor-net
    depends_on:
      memory-db:
        condition: service_healthy
      vault-db:
        condition: service_healthy

  anchor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegismem-anchor-witness
    command: ["uvicorn", "services.anchor_service:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - AEGISMEM_INTERNAL_TOKEN=${AEGISMEM_INTERNAL_TOKEN}
    volumes:
      # Anchor witness gets anchor private key + public keys read-only
      - ./security/anchor_keys:/app/security/keys:ro
    networks:
      - anchor-net

  support-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegismem-support-agent
    command: ["uvicorn", "services.agent_service:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      - GATEWAY_URL=http://aegismem-gateway:8000
      - DATABASE_URL=postgresql+psycopg2://${AEGISMEM_DB_USER:-aegis_admin}:${AEGISMEM_DB_PASSWORD:?AEGISMEM_DB_PASSWORD is required}@memory-db:5432/${AEGISMEM_DB_NAME:-aegismem_live}
      - AEGISMEM_INTERNAL_TOKEN=${AEGISMEM_INTERNAL_TOKEN}
    volumes:
      - ./security/public_keys:/app/security/keys:ro
      - ./security/integrity_manifests:/app/security/integrity_manifests:ro
    networks:
      - public-net
      - data-net
    depends_on:
      - aegismem-gateway
      - memory-db

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegismem-dashboard
    command: ["python", "scripts/dashboard_server.py", "--port", "5173", "--gateway", "http://aegismem-gateway:8000"]
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/dist:/app/frontend/dist:ro
    networks:
      - public-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - aegismem-gateway

  attacker:
    build:
      context: .
      dockerfile: Dockerfile.attacker
    container_name: aegismem-attacker
    command: ["sleep", "infinity"]
    networks:
      - public-net
    depends_on:
      - aegismem-gateway

networks:
  public-net:
    driver: bridge
  data-net:
    driver: bridge
    internal: true
  vault-net:
    driver: bridge
    internal: true
  anchor-net:
    driver: bridge
    internal: true

volumes:
  memory_pgdata:
  vault_pgdata:
